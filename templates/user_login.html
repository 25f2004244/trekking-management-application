{%extends "base.html"%}

{%block title%}Login-Trekkers{%endblock%}
{%block content%}
<h1 style="display: block; text-align: center;">Welcome to <i>TREKKERS</i></h1>

<div class="input-form">
    <form method="post">
        <h3>Login here :</h3>
        <table class="center">
            <tr>
                <td><label for="email">Email Id</label></td>
                <td><input required type="email" name="email" id="email" placeholder="example@gmail.com"></td>
            </tr>

            <tr>
                <td><label for="password">Password</label></td>
                <td><input required type="password" name="password" id="password" placeholder="Password"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button class="button btn-update" type="submit">Login</button>
                </td>
            </tr>
            <br>

        </table>
        <span>Not have an account?</span><a href="{{url_for('signup')}}">Sign Up</a><br><br>
    </form>
</div>

{%endblock%}
