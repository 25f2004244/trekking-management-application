{% extends 'base.html' %}
{% block title %}Edit-Trek{% endblock %}

{% block content %}
<div class="input-form" style="background-color: beige;">

    <form method="POST">
        <h2 class="center"><strong>Edit Trek - {{trek.name}}</strong></h2><br>
        <table class="center">
            <tr>
                <td>
                    <label>Name:</label>
                    <input type="text" name="name" value="{{ trek.name }}" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Location:</label>
                    <input type="text" name="location" value="{{ trek.location }}" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Total Slots:</label>
                    <input type="number" name="slots" value="{{ trek.slots }}">
                </td>
            </tr>

            <tr>
                <td>
                    <label>Status:</label>
                    <select name="status">
                        <option value="Open" {% if trek.status=='Open' %}selected{% endif %}>Open</option>
                        <option value="Ongoing" {% if trek.status=='Ongoing' %}selected{% endif %}>Ongoing</option>
                        <option value="Closed" {% if trek.status=='Closed' %}selected{% endif %}>Closed</option>
                        <option value="Completed" {% if trek.status=='Completed' %}selected{% endif %}>Completed
                        </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Assign Staff:</label>
                    <select name="staff_id">
                        <option value="">Select Staff</option>
                        {% for s in staff %}
                        <option value="{{ s.user_id }}" {% if trek.staff and trek.staff.user_id==s.user_id %}selected{%
                            endif %}>
                            {{ s.username }}
                        </option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="button btn-approve" type="submit"><b>Save Changes</b></button>
                </td>
            </tr>

        </table>

    </form>
</div>
{% endblock %}
